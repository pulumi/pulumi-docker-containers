permissions: write-all # Equivalent to default permissions plus id-token: write
# Updates the description of every Pulumi image repository on Docker Hub and
# AWS ECR Public Gallery from the READMEs in this repository. Each registry
# keeps a single description per repository, so this runs at the end of each
# release to keep the description in sync with the `latest` image.
name: Sync READMEs
on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - sync-readmes

env:
  DOCKER_USERNAME: pulumibot
  DOCKER_ORG: pulumi
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: imports/github-secrets
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.define-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check READMEs are up to date
        run: python ./.github/scripts/readme/gen-readmes.py --check
      - name: Define Matrix
        id: define-matrix
        run: |
          echo "matrix=$(python ./.github/scripts/readme/gen-sync-readmes-matrix.py)" >> "$GITHUB_OUTPUT"

  sync-readme:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    needs: define-matrix
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ steps.esc-secrets.outputs.DOCKER_HUB_PASSWORD }}
          repository: ${{ env.DOCKER_ORG }}/${{ matrix.repo }}
          short-description: ${{ matrix.short_description }}
          readme-filepath: ${{ matrix.readme }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ steps.esc-secrets.outputs.AWS_ACCESS_KEY_ID }}
          aws-region: us-east-2
          aws-secret-access-key: ${{ steps.esc-secrets.outputs.AWS_SECRET_ACCESS_KEY }}
          role-duration-seconds: 3600
          role-external-id: upload-pulumi-release
          role-session-name: pulumi@githubActions
          role-to-assume: ${{ steps.esc-secrets.outputs.AWS_UPLOAD_ROLE_ARN }}
      - name: Update ECR Public Gallery description
        env:
          REPO: ${{ matrix.repo }}
          README: ${{ matrix.readme }}
          SHORT_DESCRIPTION: ${{ matrix.short_description }}
        run: |
          jq -n \
            --arg description "$SHORT_DESCRIPTION" \
            --rawfile aboutText "$README" \
            '{description: $description, aboutText: $aboutText}' > "$RUNNER_TEMP/catalog-data.json"
          # ECR Public is only available in us-east-1.
          aws ecr-public put-repository-catalog-data \
            --region us-east-1 \
            --repository-name "$REPO" \
            --catalog-data "file://$RUNNER_TEMP/catalog-data.json"
